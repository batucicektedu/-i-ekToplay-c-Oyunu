<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

  #intro{position:absolute;left:0;right:0;top:56%;height:180px;display:none;pointer-events:none;z-index:6;text-align:center}

  #intro .ring{position:absolute;left:50%;top:6px;width:60px;height:60px;margin-left:-30px;border-radius:50%;border:5px solid rgba(255,255,255,.85);animation:swipeRing 1.7s ease-in-out infinite}

  @keyframes swipe{0%{transform:translate(-75px,10px) scale(1)}12%{transform:translate(-75px,14px) scale(.86)}78%{transform:translate(75px,14px) scale(.86)}92%,100%{transform:translate(75px,10px) scale(1);opacity:0}}
  @keyframes swipeRing{0%{transform:translate(-75px,10px) scale(.6);opacity:0}12%{transform:translate(-75px,14px) scale(1);opacity:1}78%{transform:translate(75px,14px) scale(1);opacity:1}92%,100%{transform:translate(75px,10px) scale(1.3);opacity:0}}
  @keyframes hintPulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #praise{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:46px;pointer-events:none;opacity:0;z-index:7}
  #praise.big{font-size:40px}
  #praise.show{animation:praisePop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes praisePop{0%{transform:scale(.3) rotate(-6deg);opacity:0}18%{transform:scale(1.25) rotate(3deg);opacity:1}30%{transform:scale(1) rotate(0)}78%{transform:scale(1);opacity:1}100%{transform:scale(1) translateY(-40px);opacity:0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  #flash.on{animation:flashA .35s ease-out}
  @keyframes flashA{0%{opacity:.55}100%{opacity:0}}
  #fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
  .coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc21a 55%,#c98400);border:2px solid #8a5a00;box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .gain{position:absolute;font-size:24px;color:#6dff6a;font-weight:900;-webkit-text-stroke:4px #0c2a12;paint-order:stroke fill;animation:gainUp .9s ease-out forwards}
  @keyframes gainUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{transform:translateY(-6px) scale(1.15);opacity:1}100%{transform:translateY(-44px) scale(1);opacity:0}}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#16324a;font-size:20px;text-align:center;padding:20px;background:#8fd8ff;z-index:10}
</style>
