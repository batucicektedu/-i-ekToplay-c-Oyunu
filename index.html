<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<title>Çiçek Bahçesi</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ff;touch-action:none;overscroll-behavior:none;
    font-family:'Arial Rounded MT Bold','Nunito','Baloo 2','Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .txt{color:#fff;font-weight:900;letter-spacing:.5px;paint-order:stroke fill;-webkit-text-stroke:5px #16324a;
    text-shadow:0 3px 0 #16324a}
  #hud{position:absolute;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:999px;
    background:rgba(18,48,74,.55);box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.25)}
  .pill svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  #money{font-size:30px}
  #money.bump{animation:bump .25s ease-out}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #capP{font-size:20px;margin-top:8px;display:flex;width:fit-content}
  #capP svg{width:26px;height:26px}
  #capP.full #capV{color:#ffb703}
  #topleft{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
  #hint{position:absolute;left:50%;top:max(78px,calc(env(safe-area-inset-top) + 66px));transform:translateX(-50%);display:none;align-items:center;gap:10px;
    padding:8px 18px 8px 12px;border-radius:18px;background:rgba(255,255,255,.92);color:#16324a;font-weight:900;font-size:20px;
    box-shadow:0 4px 0 rgba(0,0,0,.2);white-space:nowrap;animation:hintPulse 1.6s ease-in-out infinite}
  #hint svg{width:34px;height:34px;flex:none;transition:transform .1s linear}
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
  #reset{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));pointer-events:auto;
    font:700 12px/1 inherit;font-family:inherit;color:#fff;background:rgba(18,48,74,.45);border:0;border-radius:10px;padding:7px 10px;opacity:.65}
  #joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);
    border:3px solid rgba(255,255,255,.55);display:none;pointer-events:none;z-index:5}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.2)}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#16324a;font-size:20px;text-align:center;padding:20px;background:#8fd8ff;z-index:10}
</style>
</head>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const _mc = {};

  sph: new THREE.SphereGeometry(1, 16, 12), cyl: new THREE.CylinderGeometry(1, 1, 1, 14), box: new THREE.BoxGeometry(1, 1, 1),

}
const _rb = {};
function roundedBoxGeo(w, h, d, r) {

/* ---- icon painters (procedural, no emoji / fonts needed) ---- */
function iconFlower(ctx, cx, cy, s, col) {

  nudge.t += dt; const nw = nudge.t < 2.2 ? Math.sin(Math.PI * nudge.t / 2.2) : 0;
  camFocus.x = damp(camFocus.x, lerp(tx, nudge.x, nw * 0.6), 4.5, dt); camFocus.z = damp(camFocus.z, lerp(tz, nudge.z, nw * 0.6), 4.5, dt);
  camS = damp(camS, 1 + (zone2 && !zone2.locked ? 0.2 : 0) + (zone3 && !zone3.locked ? 0.12 : 0), 1.2, dt);
  const cd = camDist * camMul * camS * (1 - 0.1 * nw), H = cd * Math.cos(CFG.tilt), Y = cd * Math.sin(CFG.tilt);
  camera.position.set(camFocus.x + Math.sin(CFG.yaw) * H, Y, camFocus.z + Math.cos(CFG.yaw) * H);
  camera.lookAt(camFocus.x, 0, camFocus.z);
  sun.position.set(gp.x - 9, 24, gp.z + 7); sun.target.position.set(gp.x, 0, gp.z); sun.target.updateMatrixWorld();
  updateTutorial(dt, T); updateHUD(dt);
  saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; writeSave(); }
}

function snapshot() {
  const paid = {}, shown = {}; for (const k in upPads) { if (upPads[k].paid > 0) paid[k] = upPads[k].paid; if (upPads[k].shown) shown[k] = 1; }
  const x = { paid, shown, mp: moneyPile.length + (moneyPile.extra || 0), vp: vanPile.length + (vanPile.extra || 0), sb: shelfB.length, sp: shelfP.length, pi: potInput.length, po: potOutput.length, ii: inputPile.length, oo: outputPile.length };
  const away = VAN.state === 'away' || VAN.state === 'depart' || VAN.state === 'return';
  x.van = { away, load: vanLoad.length + (VAN.state === 'loading' ? 8 - vanLoad.length : 0), sum: VAN.sum, until: away ? Date.now() + Math.max(0, 20 - VAN.trip) * 1000 : 0 };
  return x;
}
function fillStack(st, n, maker, type) { for (let i = 0; i < n && st.length < st.cap; i++) st.add(maker(), type); }
function restoreExtras(x) {
  if (!x) return;
  const num = v => Math.max(0, Math.floor(+v || 0));
  for (const k in (x.paid || {})) if (upPads[k]) upPads[k].paid = Math.min(num(x.paid[k]), Math.max(0, (upPads[k].cost() || 1) - 1));
  for (const k in (x.shown || {})) if (upPads[k]) upPads[k].shown = true;
  const bills = (st, n) => { n = num(n); fillStack(st, Math.min(n, st.cap), makeBill, 'bill'); st.extra = Math.max(0, n - st.cap); };
  bills(moneyPile, x.mp); fillStack(shelfB, num(x.sb), () => makeBouquetItem(undefined, true), 'bouquet'); fillStack(shelfP, num(x.sp), () => makePotItem(true), 'pot');
  fillStack(inputPile, num(x.ii), () => makeFlowerItem(Math.floor(Math.random() * 4), 'tulip'), 'flower'); fillStack(outputPile, num(x.oo), () => makeBouquetItem(undefined, true), 'bouquet');
  if (zone2 && !zone2.locked) { fillStack(potInput, num(x.pi), () => makeFlowerItem(Math.floor(Math.random() * 4), 'orchid'), 'orchid'); fillStack(potOutput, num(x.po), () => makePotItem(true), 'pot'); }
  if (zone3 && !zone3.locked && x.van) {
    bills(vanPile, x.vp); VAN.sum = num(x.van.sum);
    if (x.van.away) { VAN.state = 'away'; VAN.group.visible = false; const rem = Math.max(0, (+x.van.until - Date.now()) / 1000); VAN.trip = rem <= 0 ? 14.5 : clamp(20 - rem, 0, 14.5); }
    else fillStack(vanLoad, Math.min(8, num(x.van.load)), () => makeBouquetItem(undefined, true), 'bouquet');
    vanHud();
  }
}
/* =====================================================================
   15. INIT
   ===================================================================== */
buildGround(); buildFences();
// hedges around beds (east side open to the plaza)
buildHedge(-17.85, 0, 0.8, 23.2, 0.95);
buildHedge(-14, -11.35, 7.4, 0.8, 0.95);
buildHedge(-14, 11.35, 7.4, 0.8, 0.95);
// plaza edge hedges / bushes
buildHedge(13.6, 12.9, 4.2, 0.9, 0.9); buildHedge(5.2, 12.9, 6.4, 0.9, 0.9);
for (const [x, z, s] of [[-18, -9, 1], [-6, -9.5, 1.2], [4, -9, 1], [13, -8.5, 1.2], [-19.2, 13, 1], [18.5, 13, 1.1], [6, 13.4, 0.9]]) buildBush(x, z, s);
for (const [x, z, s] of [[-24, -14, 1.5], [-22, 3, 1.3], [-24, 14, 1.6], [-12, -16, 1.4], [0, -16, 1.6], [12, -16, 1.4], [23, -13, 1.5], [-15, 19, 1.4], [-26, -3, 1.6]]) buildTree(x, z, s);
buildDecorFlowers();
for (let i = 0; i < 3; i++) buildBed(i);
buildStations(); buildDecor(); buildSera(); buildVan(); buildZones(); buildPlayer();
// restore progress
if (S.lv.bed > 0) { unlockBed(beds[2], true); upPads.bed.done = true; upPads.bed.group.visible = false; }
if (S.lv.sera > 0) unlockSera(true);
if (S.lv.van > 0) unlockVan(true);
if (S.lv.helper > 0) spawnHelper(true);
if (S.lv.cashier > 0) spawnCashier(true);
if (S.lv.carrier > 0) spawnCarrier(true);
for (const k in upPads) { const u = upPads[k]; if (S.lv[k] >= u.max()) { u.done = true; u.group.visible = false; } else { if (u.vis) u.group.visible = u.vis(); u.redraw(); } }
restoreExtras(LOADED_X); for (const k in upPads) if (!upPads[k].done) upPads[k].redraw();
for (let i = 0; i < 3; i++) { spawnCustomer(CFG.queueZ0 + i * CFG.queueGap); const c = customers[customers.length - 1]; c.group.position.x = CFG.queueX; c.yaw = 0; c.group.rotation.y = Math.PI; c.yaw = Math.PI; c.atSlot = true; }
onResize();

window.__game = {
  S, stats, P: () => P, queue, beds, machine, inputPile, outputPile, moneyPile, get shelf() { return shelfB; }, get shelfP() { return shelfP; }, get potInput() { return potInput; }, get potOutput() { return potOutput; }, get zone2() { return zone2; }, get zone3() { return zone3; }, VAN, get vanLoad() { return vanLoad; }, get vanPile() { return vanPile; }, get cashier() { return cashier; }, get carrier() { return carrier; }, upPads, zones, customers, CFG, POS,
  helper: () => helper,
  tp(x, z) { P.group.position.set(x, 0, z); P.vel.set(0, 0, 0); camInit = false; },
  sim(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) update(1 / 30); },
  render() { renderer.render(scene, camera); },
  get calls() { return renderer.info.render.calls; }, tutStep: () => S.tut, forceVip() { custCount = 5; }, zoom(v) { camMul = v; }
};

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
