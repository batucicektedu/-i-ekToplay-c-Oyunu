<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<title>Çiçek Bahçesi</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ff;touch-action:none;overscroll-behavior:none;
    font-family:'Arial Rounded MT Bold','Nunito','Baloo 2','Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .txt{color:#fff;font-weight:900;letter-spacing:.5px;paint-order:stroke fill;-webkit-text-stroke:5px #16324a;
    text-shadow:0 3px 0 #16324a}
  #hud{position:absolute;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:999px;
    background:rgba(18,48,74,.55);box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.25)}
  .pill svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  #money{font-size:30px}
  #money.bump{animation:bump .25s ease-out}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #capP{font-size:20px;margin-top:8px;display:flex;width:fit-content}
  #capP svg{width:26px;height:26px}
  #capP.full #capV{color:#ffb703}
  #topleft{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
  #hint{position:absolute;left:50%;top:max(78px,calc(env(safe-area-inset-top) + 66px));transform:translateX(-50%);display:none;align-items:center;gap:10px;
    padding:8px 18px 8px 12px;border-radius:18px;background:rgba(255,255,255,.92);color:#16324a;font-weight:900;font-size:20px;
    box-shadow:0 4px 0 rgba(0,0,0,.2);white-space:nowrap;animation:hintPulse 1.6s ease-in-out infinite}
  #hint svg{width:34px;height:34px;flex:none;transition:transform .1s linear}
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
  #reset{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));pointer-events:auto;
    font:700 12px/1 inherit;font-family:inherit;color:#fff;background:rgba(18,48,74,.45);border:0;border-radius:10px;padding:7px 10px;opacity:.65}
  #joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);
    border:3px solid rgba(255,255,255,.55);display:none;pointer-events:none;z-index:5}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.2)}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#16324a;font-size:20px;text-align:center;padding:20px;background:#8fd8ff;z-index:10}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="topleft">
      <div id="money" class="pill txt">
        <svg viewBox="0 0 48 48"><rect x="3" y="11" width="42" height="26" rx="6" fill="#3fbf4a" stroke="#1e7a2c" stroke-width="3"/><rect x="8" y="16" width="32" height="16" rx="3" fill="none" stroke="#a6ee9c" stroke-width="2"/><circle cx="24" cy="24" r="7" fill="#a6ee9c" stroke="#1e7a2c" stroke-width="2"/><text x="24" y="28.5" text-anchor="middle" font-size="12" font-weight="900" fill="#1e7a2c" font-family="Arial">$</text></svg>
        <span id="moneyV">0</span>
      </div>
      <div id="capP" class="pill txt">
        <svg viewBox="0 0 48 48"><path d="M24 44V26" stroke="#2e9a3e" stroke-width="4" stroke-linecap="round"/><path d="M24 36c-8 0-10-6-10-9 6 0 10 3 10 9z" fill="#3fbf4a"/><path d="M13 12c0-5 3-8 5-9 2 2 4 3 6 3 2 0 4-1 6-3 2 1 5 4 5 9 0 8-5 15-11 15S13 20 13 12z" fill="#ff4f7b" stroke="#b81f4a" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span id="capV">0/10</span>
      </div>
    </div>
    <div id="hint">
      <svg id="hintArrow" viewBox="0 0 48 48"><path d="M6 18h20V8l16 16-16 16V30H6z" fill="#ffb703" stroke="#b36b00" stroke-width="3" stroke-linejoin="round"/></svg>
      <span id="hintT"></span>
    </div>
    <button id="reset">Sıfırla</button>
  </div>
  <div id="joyBase"><div id="joyKnob"></div></div>
</div>
<div id="msg">Three.js yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
if (typeof THREE === 'undefined') { document.getElementById('msg').style.display = 'flex'; return; }

/* =====================================================================
   1. CONFIG
   ===================================================================== */
const CFG = {
  yaw: 0.45, tilt: 52 * Math.PI / 180, fov: 45,
  baseSpeed: 5.6, speedStep: 0.15,
  capBase: 10, capStep: 5,
  growTime: 4, billValue: 10,
  packBase: 1.0, packMul: 0.75,
  transferEvery: 0.08,
  inputCap: 24, outputCap: 27, moneyCap: 60,
  queueMax: 6, spawnEvery: 5.5, queueX: 10, queueZ0: -1.5, queueGap: 1.5,
  helperCap: 6,
  bounds: { x0: -19, x1: 17.8, z0: -11, z1: 16 },
  start: { x: 2, z: 4 }
};
const UPG = {
  cap:    { name: 'Kapasite',       costs: [50, 100, 200, 350, 600] },
  speed:  { name: 'Hız',            costs: [60, 120, 240, 480] },
  pack:   { name: 'Paketleme Hızı', costs: [80, 160, 320, 640] },
  bed:    { name: 'Yeni Bahçe',     costs: [150] },
  helper: { name: 'Yardımcı',       costs: [300] }
};
const POS = {
  packTable: { x: -5, z: -2.2 }, packPad: { x: -5, z: 0.7 },
  outTable: { x: 0.5, z: -2.2 }, outPad: { x: 0.5, z: 0.7 },
  counter: { x: 10, z: -3.4 }, counterPad: { x: 7.4, z: -1.3 },
  moneyPile: { x: 13.7, z: -3.2 },
  beds: [{ x: -14, z: -7.4 }, { x: -14, z: 0 }, { x: -14, z: 7.4 }],
  upgradeZ: 9
};
const TABLE_Y = 1.0;
const FLOWER_COLS = [0xe8283c, 0xff6fa5, 0xffcf33, 0xfff4f0];
const SAVE_KEY = 'cicek_bahcesi_v1';

/* =====================================================================
   2. UTILS, SAVE, AUDIO
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const rand = (a, b) => a + Math.random() * (b - a);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const easeOutBack = t => { const c = 1.70158; t = clamp(t, 0, 1); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rm(o) { if (o && o.parent) o.parent.remove(o); }

const S = { money: 0, lv: { cap: 0, speed: 0, pack: 0, bed: 0, helper: 0 }, tut: 0 };
let saveDirty = false, saveTimer = 0;
(function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') {
      S.money = Math.max(0, Math.floor(+s.money || 0));
      for (const k in S.lv) S.lv[k] = clamp(Math.floor((s.lv && s.lv[k]) || 0), 0, UPG[k].costs.length);
      S.tut = clamp(Math.floor(+s.tut || 0), 0, 6);
    }
  } catch (e) {}
})();
function writeSave() { saveDirty = false; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

let AC = null; const sfxLast = {};
function initAudio() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function blip(f, dur, type, vol, slide, delay) {
  if (!AC) return;
  try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function sfx(name) {
  const now = performance.now();
  if (sfxLast[name] && now - sfxLast[name] < 45) return; sfxLast[name] = now;
  switch (name) {
    case 'pick': blip(520 + Math.random() * 160, 0.09, 'sine', 0.11, 1.7); break;
    case 'drop': blip(330 + Math.random() * 60, 0.07, 'triangle', 0.1, 1.4); break;
    case 'pack': blip(240, 0.12, 'square', 0.04, 1.8); break;
    case 'cash': blip(880, 0.09, 'square', 0.04); blip(1320, 0.14, 'square', 0.04, 1, 0.07); break;
    case 'coin': blip(1000 + Math.random() * 200, 0.08, 'triangle', 0.08, 1.4); break;
    case 'up': [523, 659, 784, 1047].forEach((f, i) => blip(f, 0.16, 'triangle', 0.1, 1, i * 0.08)); break;
    case 'happy': blip(660, 0.1, 'sine', 0.1, 1.5); blip(990, 0.15, 'sine', 0.1, 1, 0.09); break;
  }
}

/* =====================================================================
   3. RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvasEl = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
const lc = h => new THREE.Color(h).convertSRGBToLinear();
const scene = new THREE.Scene();
(function () {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#5db8f5'); g.addColorStop(0.55, '#a9dcff'); g.addColorStop(1, '#e6f5ff');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
})();
scene.fog = new THREE.Fog(lc(0xcfe8fa), 55, 125);
const camera = new THREE.PerspectiveCamera(CFG.fov, 1, 0.5, 220);
let camDist = 26, camMul = 1;
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const t = Math.tan(CFG.fov * Math.PI / 360);
  camDist = clamp(16 / (2 * t * camera.aspect), 23, 36);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x7fb85a, 0.95));
const sun = new THREE.DirectionalLight(0xffe9c4, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -15; sc.right = 15; sc.top = 15; sc.bottom = -15; sc.near = 1; sc.far = 70;
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03; sun.shadow.radius = 2.5;
scene.add(sun); scene.add(sun.target);

/* =====================================================================
   4. HELPERS: materials, geometry, canvas textures, sprites
   ===================================================================== */
const _mc = {};
function mat(c) { return _mc[c] || (_mc[c] = new THREE.MeshLambertMaterial({ color: lc(c) })); }
const G = {
  sph: new THREE.SphereGeometry(1, 16, 12), cyl: new THREE.CylinderGeometry(1, 1, 1, 14), box: new THREE.BoxGeometry(1, 1, 1),
  cone: new THREE.ConeGeometry(1, 1, 14), hair: new THREE.SphereGeometry(1, 16, 12, 0, TAU, 0, Math.PI * 0.58),
  torus: new THREE.TorusGeometry(1, 0.4, 6, 14), plane: new THREE.PlaneGeometry(1, 1)
};
function mk(geo, m, sx, sy, sz, x, y, z) {
  const o = new THREE.Mesh(geo, m); o.scale.set(sx, sy, sz); o.position.set(x || 0, y || 0, z || 0); return o;
}
const _rb = {};
function roundedBoxGeo(w, h, d, r) {
  const key = [w, h, d, r].join(',');
  if (_rb[key]) return _rb[key];
  const g = new THREE.BoxGeometry(w, h, d, 6, 4, 6);
  const p = g.attributes.position, n = g.attributes.normal;
  const ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const cx = clamp(x, -ix, ix), cy = clamp(y, -iy, iy), cz = clamp(z, -iz, iz);
    let dx = x - cx, dy = y - cy, dz = z - cz; const l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;
    p.setXYZ(i, cx + dx * r, cy + dy * r, cz + dz * r); n.setXYZ(i, dx, dy, dz);
  }
  return (_rb[key] = g);
}
function rbox(w, h, d, r, m, x, y, z) { return new THREE.Mesh(roundedBoxGeo(w, h, d, r), m); }
function place(o, x, y, z) { o.position.set(x, y, z); return o; }
function shadowAll(o, cast, recv) { o.traverse(c => { if (c.isMesh) { c.castShadow = !!cast; c.receiveShadow = !!recv; } }); }

function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function otext(ctx, t, x, y, size, fill, stroke, sw) {
  ctx.font = '900 ' + size + 'px "Arial Rounded MT Bold","Nunito",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = sw || size * 0.18; ctx.strokeStyle = stroke || '#16324a'; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill || '#fff'; ctx.fillText(t, x, y);
}
function canvasTex(c, rep) {
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}

/* ---- icon painters (procedural, no emoji / fonts needed) ---- */
function iconFlower(ctx, cx, cy, s, col) {
  col = col || '#ff3d6e';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2e9a3e'; ctx.lineWidth = s * 0.09; ctx.beginPath(); ctx.moveTo(cx, cy + s * 0.5); ctx.lineTo(cx, cy + s * 0.05); ctx.stroke();
  ctx.fillStyle = '#3fbf4a'; ctx.beginPath(); ctx.ellipse(cx + s * 0.16, cy + s * 0.3, s * 0.16, s * 0.07, -0.6, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.strokeStyle = 'rgba(80,0,30,.55)'; ctx.lineWidth = s * 0.035;
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * TAU - Math.PI / 2;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * s * 0.2, cy - s * 0.12 + Math.sin(a) * s * 0.2, s * 0.17, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(cx, cy - s * 0.12, s * 0.12, 0, TAU); ctx.fill();
}
function iconBouquet(ctx, cx, cy, s) {
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#3fbf4a'; ctx.beginPath(); ctx.ellipse(cx - s * 0.25, cy - s * 0.1, s * 0.13, s * 0.06, -0.7, 0, TAU); ctx.ellipse(cx + s * 0.25, cy - s * 0.1, s * 0.13, s * 0.06, 0.7, 0, TAU); ctx.fill();
  const cols = ['#ff3d5a', '#ff8fc0', '#ffd23f'];
  [[-0.2, -0.22], [0.2, -0.22], [0, -0.34]].forEach((p, i) => {
    ctx.fillStyle = cols[i]; ctx.strokeStyle = 'rgba(60,0,20,.5)'; ctx.lineWidth = s * 0.03;
    ctx.beginPath(); ctx.arc(cx + p[0] * s, cy + p[1] * s, s * 0.17, 0, TAU); ctx.fill(); ctx.stroke();
  });
  ctx.fillStyle = '#fff3e0'; ctx.strokeStyle = '#c9a77a'; ctx.lineWidth = s * 0.05;
  ctx.beginPath(); ctx.moveTo(cx - s * 0.38, cy - s * 0.12); ctx.lineTo(cx + s * 0.38, cy - s * 0.12); ctx.lineTo(cx, cy + s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff6fa5'; ctx.beginPath(); ctx.moveTo(cx - s * 0.12, cy + s * 0.12); ctx.lineTo(cx + s * 0.12, cy + s * 0.12); ctx.lineTo(cx, cy + s * 0.24); ctx.fill();
}
function iconBill(ctx, cx, cy, s) {
  ctx.fillStyle = '#3fbf4a'; ctx.strokeStyle = '#1e7a2c'; ctx.lineWidth = s * 0.07;
  rrect(ctx, cx - s * 0.5, cy - s * 0.3, s, s * 0.6, s * 0.1); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#a6ee9c'; ctx.lineWidth = s * 0.035; rrect(ctx, cx - s * 0.4, cy - s * 0.21, s * 0.8, s * 0.42, s * 0.05); ctx.stroke();
  ctx.fillStyle = '#a6ee9c'; ctx.beginPath(); ctx.arc(cx, cy, s * 0.16, 0, TAU); ctx.fill();
  otext(ctx, '$', cx, cy + s * 0.01, s * 0.24, '#1e7a2c', '#a6ee9c', 0);
}
function iconSmile(ctx, cx, cy, s) {
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = s * 0.07;
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.46, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a10'; ctx.beginPath(); ctx.ellipse(cx - s * 0.16, cy - s * 0.1, s * 0.05, s * 0.08, 0, 0, TAU); ctx.ellipse(cx + s * 0.16, cy - s * 0.1, s * 0.05, s * 0.08, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#5a3a10'; ctx.lineWidth = s * 0.06; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy + s * 0.02, s * 0.25, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.fillStyle = 'rgba(255,90,90,.45)'; ctx.beginPath(); ctx.arc(cx - s * 0.3, cy + s * 0.12, s * 0.07, 0, TAU); ctx.arc(cx + s * 0.3, cy + s * 0.12, s * 0.07, 0, TAU); ctx.fill();
}
function iconBackpack(ctx, cx, cy, s) {
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#7a3b12'; ctx.lineWidth = s * 0.06;
  ctx.fillStyle = '#ff9f1c'; rrect(ctx, cx - s * 0.32, cy - s * 0.38, s * 0.64, s * 0.8, s * 0.2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffc15e'; rrect(ctx, cx - s * 0.22, cy + s * 0.05, s * 0.44, s * 0.26, s * 0.08); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e07b00'; rrect(ctx, cx - s * 0.2, cy - s * 0.5, s * 0.4, s * 0.16, s * 0.07); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3fbf4a'; ctx.strokeStyle = '#1e7a2c'; ctx.lineWidth = s * 0.04;
  ctx.beginPath(); ctx.arc(cx + s * 0.3, cy - s * 0.3, s * 0.17, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.06; ctx.beginPath(); ctx.moveTo(cx + s * 0.3, cy - s * 0.38); ctx.lineTo(cx + s * 0.3, cy - s * 0.22); ctx.moveTo(cx + s * 0.22, cy - s * 0.3); ctx.lineTo(cx + s * 0.38, cy - s * 0.3); ctx.stroke();
}
function iconBolt(ctx, cx, cy, s) {
  ctx.lineJoin = 'round'; ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b36b00'; ctx.lineWidth = s * 0.07;
  ctx.beginPath(); ctx.moveTo(cx + s * 0.1, cy - s * 0.5); ctx.lineTo(cx - s * 0.3, cy + s * 0.08); ctx.lineTo(cx - s * 0.02, cy + s * 0.08);
  ctx.lineTo(cx - s * 0.12, cy + s * 0.5); ctx.lineTo(cx + s * 0.32, cy - s * 0.12); ctx.lineTo(cx + s * 0.04, cy - s * 0.12); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function iconPack(ctx, cx, cy, s) {

function attachBackStack(c, capFn) {

  const sway = (i, out, t) => {

    out.z += c.swayZ * hf;

  c.free = () => capFn() - c.stack.length - c.incoming;
}
function updateSway(c, dt) {
  const s = Math.sin(c.yaw), co = Math.cos(c.yaw);
  const lx = c.vel.x * co - c.vel.z * s, lz = c.vel.x * s + c.vel.z * co;

}

  f.t = 0; f.pop = 0.18; f.claimed = false; f.full = false; f.g.userData.stem.scale.y = 0.001; f.g.userData.bloom.scale.setScalar(0.001);

  fly(it.mesh, out => { inputPile.slotFn(Math.min(idx, CFG.inputCap - 1), out); return 0; }, 0.32, 1.3, () => { inputPile.pend--; inputPile.add(it.mesh, 'flower'); });

function updatePacking(dt, t) {
  const m = machine, interval = packInterval();
  if (!m.working && inputPile.length > 0 && outputPile.length + m.pendingOut < CFG.outputCap) {
    const it = inputPile.takeLast('flower');
    fly(it.mesh, out => { out.set(m.x, TABLE_Y + 1.5, m.z); return 0; }, 0.25, 0.6, () => { rm(it.mesh); sfx('pack'); });
    m.working = true; m.timer = 0;
  }
  if (m.working) {
    m.timer += dt; const k = clamp(m.timer / interval, 0, 1);
    machine.bar.visible = machine.barBg.visible = true; machine.bar.scale.x = Math.max(0.001, 1.2 * k); machine.bar.position.x = machine.x - 0.6 + 0.6 * k;
    m.group.scale.y = 1 + Math.sin(t * 22) * 0.025; m.group.position.y = TABLE_Y + Math.abs(Math.sin(t * 14)) * 0.03;
    if (m.timer >= interval) {

      const idx = outputPile.length + m.pendingOut - 1; burst(m.x, TABLE_Y + 0.8, m.z + 0.9, 0xffffff, 5, 2);
      fly(b, out => { outputPile.slotFn(Math.min(idx, CFG.outputCap - 1), out); return 0; }, 0.5, 1.6, () => { m.pendingOut--; outputPile.add(b, 'bouquet'); sfx('drop'); });
    }
  } else { machine.bar.visible = machine.barBg.visible = false; m.group.scale.y = damp(m.group.scale.y, 1, 10, dt); m.group.position.y = TABLE_Y; }
  const w = m.worker; animChar(w, dt, 0, t);

  w.body.position.y = wk * Math.abs(Math.sin(t * 10)) * 0.05;
}

function updateUpgrades(dt) {
  for (const key in upPads) {
    const u = upPads[key]; if (u.done) continue;
    if (!u.inside || S.money <= 0) continue;
    u.tick -= dt; if (u.tick > 0) continue; u.tick = 0.05;
    const cost = u.cost(), rem = cost - u.paid, amt = Math.min(S.money, rem, Math.max(1, Math.ceil(cost / 40)));
    if (amt <= 0) continue;
    S.money -= amt; u.paid += amt; saveDirty = true; sfx('coin');
    const b = makeBill(); b.position.set(P.group.position.x, 1.4, P.group.position.z); scene.add(b);
    fly(b, out => { out.set(u.x, 0.5, u.z); return 0; }, 0.3, 1.2, () => rm(b));
    u.redraw();

}

}

window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function joyStart(e) {
  if (e.target && e.target.closest && e.target.closest('button')) return;
  initAudio();
  if (joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  joyBase.style.display = 'block'; joyBase.style.left = e.clientX + 'px'; joyBase.style.top = e.clientY + 'px'; joyKnob.style.transform = 'translate(0,0)';
}
function joyMove(e) {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const R = 52, l = Math.hypot(dx, dy);
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  joy.x = dx / R; joy.y = dy / R; joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
function joyEnd(e) { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; joyBase.style.display = 'none'; }
window.addEventListener('pointerdown', joyStart); window.addEventListener('pointermove', joyMove);
window.addEventListener('pointerup', joyEnd); window.addEventListener('pointercancel', joyEnd);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
function inputVec(out) {
  let x = joy.x, y = joy.y;
  if (keys.KeyA || keys.ArrowLeft) x -= 1; if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) y -= 1; if (keys.KeyS || keys.ArrowDown) y += 1;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  if (l < 0.08) { x = y = 0; }
  // camera relative: screen right / screen up
  const s = Math.sin(CFG.yaw), c = Math.cos(CFG.yaw);
  out.x = x * c + (-y) * (-s); out.z = x * (-s) + (-y) * (-c);
  return out;
}

/* =====================================================================
   13. UI / TUTORIAL
   ===================================================================== */
const moneyEl = document.getElementById('money'), moneyV = document.getElementById('moneyV'), capP = document.getElementById('capP'), capV = document.getElementById('capV');
const hintEl = document.getElementById('hint'), hintT = document.getElementById('hintT'), hintArrow = document.getElementById('hintArrow');
document.getElementById('reset').addEventListener('click', () => {
  if (window.confirm('Tüm ilerleme silinsin mi?')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} window.__resetting = true; location.reload(); }
});
window.addEventListener('beforeunload', () => { if (!window.__resetting) writeSave(); });
let dispMoney = S.money;

const TUT = [
  { t: 'Çiçekleri topla', done: () => stats.harvested >= 4 },
  { t: 'Paketleme alanına bırak', done: () => stats.dropped >= 3 },
  { t: 'Buketleri al', done: () => stats.picked >= 1 },
  { t: 'Müşterilere sat', done: () => (stats.delivered || 0) >= 1 },
  { t: 'Paraları topla', done: () => stats.collected >= 1 },
  { t: 'Geliştirme yap', done: () => stats.upgrades >= 1 }
];
const tutArrow = new THREE.Group();
(function () {
  const m = new THREE.MeshBasicMaterial({ color: lc(0xffc400) });
  const om = new THREE.MeshBasicMaterial({ color: lc(0x16324a), side: THREE.BackSide });
  const cone = mk(G.cone, m, 0.5, 0.8, 0.5, 0, 0.4, 0); cone.rotation.x = Math.PI; tutArrow.add(cone);
  const co = mk(G.cone, om, 0.62, 0.92, 0.62, 0, 0.4, 0); co.rotation.x = Math.PI; tutArrow.add(co);
  tutArrow.add(mk(G.cyl, m, 0.17, 0.6, 0.17, 0, 1.1, 0)); tutArrow.add(mk(G.cyl, om, 0.27, 0.66, 0.27, 0, 1.1, 0));
  tutArrow.children[3].material = om; tutArrow.visible = false; scene.add(tutArrow);
})();
function tutTarget(step, out) {
  switch (step) {
    case 0: {
      let best = null, bd = 1e9; const b = beds[0];
      for (const bb of beds) { if (bb.locked) continue; for (const f of bb.flowers) if (f.t >= CFG.growTime) { const d = (f.x - P.group.position.x) ** 2 + (f.z - P.group.position.z) ** 2; if (d < bd) { bd = d; best = f; } } }
      return best ? out.set(best.x, 1.2, best.z) : out.set(b.x, 1.2, b.z);
    }
    case 1: return out.set(packZone.x, 0.4, packZone.z);
    case 2: return out.set(outZone.x, 0.4, outZone.z);
    case 3: return out.set(counterZone.x, 0.4, counterZone.z);
    case 4: return out.set(moneyZone.x, 0.8, moneyZone.z);
    default: return out.set(upPads.cap.x, 0.4, upPads.cap.z);
  }
}
const _tt = new THREE.Vector3(), _pp = new THREE.Vector3();
function updateTutorial(dt, t) {
  while (S.tut < TUT.length && TUT[S.tut].done()) { S.tut++; saveDirty = true; if (S.tut >= TUT.length) writeSave(); }
  if (S.tut >= TUT.length) { hintEl.style.display = 'none'; tutArrow.visible = false; return; }
  if (S.tut === 5 && upPads.cap.done) { /* fall back to any pad */ }
  hintEl.style.display = 'flex'; if (hintT.textContent !== TUT[S.tut].t) hintT.textContent = TUT[S.tut].t;
  tutTarget(S.tut, _tt); tutArrow.visible = true; tutArrow.position.set(_tt.x, _tt.y + 1.9 + Math.sin(t * 5) * 0.28, _tt.z);
  // screen direction
  _pp.copy(P.group.position); _pp.y = 1; _pp.project(camera); const tv = new THREE.Vector3(_tt.x, 0.5, _tt.z).project(camera);
  const w = window.innerWidth, h = window.innerHeight;
  const ang = Math.atan2(-(tv.y - _pp.y) * h / 2, (tv.x - _pp.x) * w / 2);
  hintArrow.style.transform = 'rotate(' + ang + 'rad)';
}
function updateHUD(dt) {
  dispMoney = damp(dispMoney, S.money, 12, dt); if (Math.abs(dispMoney - S.money) < 0.5) dispMoney = S.money;
  const v = String(Math.round(dispMoney)); if (moneyV.textContent !== v) moneyV.textContent = v;
  const used = P.stack.length + P.incoming, cap = P.capFn();
  const ct = used + '/' + cap; if (capV.textContent !== ct) capV.textContent = ct;
  const full = used >= cap; capP.classList.toggle('full', full); maxSprite.visible = full;
}

/* =====================================================================
   14. MAIN UPDATE / LOOP
   ===================================================================== */
const camFocus = new THREE.Vector3(CFG.start.x, 0, CFG.start.z); const inV = { x: 0, z: 0 };
let T = 0, spawnT = 3, camInit = false;

function movePlayer(dt) {
  inputVec(inV); const spd = speedOf(), mag = Math.min(1, Math.hypot(inV.x, inV.z));
  const tvx = inV.x * spd, tvz = inV.z * spd;
  P.vel.x = damp(P.vel.x, tvx, 14, dt); P.vel.z = damp(P.vel.z, tvz, 14, dt);
  const gp = P.group.position; gp.x += P.vel.x * dt; gp.z += P.vel.z * dt;
  const B = CFG.bounds; gp.x = clamp(gp.x, B.x0, B.x1); gp.z = clamp(gp.z, B.z0, B.z1);
  const r = 0.45;
  for (const c of colliders) {
    if (c.active && !c.active()) continue;
    const nx = clamp(gp.x, c.x0, c.x1), nz = clamp(gp.z, c.z0, c.z1); let dx = gp.x - nx, dz = gp.z - nz; const d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2); gp.x = nx + dx / d * r; gp.z = nz + dz / d * r; }
      else { const l = gp.x - c.x0, rr = c.x1 - gp.x, tp = gp.z - c.z0, bt = c.z1 - gp.z, m = Math.min(l, rr, tp, bt);
        if (m === l) gp.x = c.x0 - r; else if (m === rr) gp.x = c.x1 + r; else if (m === tp) gp.z = c.z0 - r; else gp.z = c.z1 + r; }
    }
  }
  const sp = Math.hypot(P.vel.x, P.vel.z);
  if (sp > 0.3) faceChar(P, P.vel.x, P.vel.z, dt);
  updateSway(P, dt); animChar(P, dt, clamp(sp / CFG.baseSpeed, 0, 1.2) * (sp > 0.3 ? 1 : 0), T);
}

function updateBeds(dt) {
  for (const b of beds) {
    if (b.locked) continue;
    for (const f of b.flowers) {
      if (f.pop > 0) { f.pop -= dt; f.g.scale.setScalar(Math.max(0.001, f.pop / 0.18) * 1.15); continue; }
      if (f.g.scale.x !== 1) f.g.scale.setScalar(1);
      if (f.t < CFG.growTime) { f.t += dt; growFlower(f); } else if (!f.full) { growFlower(f); f.full = true; }
      f.g.rotation.z = Math.sin(T * 1.7 + f.ph) * 0.045; f.g.rotation.x = Math.cos(T * 1.3 + f.ph * 1.7) * 0.03;
    }
  }
  // player harvest
  P.cd -= dt;
  if (P.cd <= 0 && P.free() > 0) {
    const gp = P.group.position;
    for (const b of beds) {
      if (b.locked || Math.abs(gp.x - b.x) > 4.2 || Math.abs(gp.z - b.z) > 3.6) continue;
      for (const f of b.flowers) {
        if (f.t >= CFG.growTime && f.pop <= 0 && (f.x - gp.x) ** 2 + (f.z - gp.z) ** 2 < 1.0) { harvest(f, P); P.cd = 0.07; if (P.free() <= 0) break; if (P.cd > 0) break; }
      }
      if (P.cd > 0) break;
    }
  }
}

let packTick = 0, outTick = 0, ctrTick = 0, monTick = 0;
function updateZoneActions(dt) {
  const gp = P.group.position;
  for (const z of zones) z.update(dt, T, gp.x, gp.z);
  packTick -= dt; outTick -= dt; ctrTick -= dt; monTick -= dt;
  if (packZone.inside && packTick <= 0 && P.stack.count('flower') > 0 && inputPile.length + (inputPile.pend || 0) < CFG.inputCap) { transferToInput(P); packTick = CFG.transferEvery; }
  if (outZone.inside && outTick <= 0 && outputPile.length > 0 && P.free() > 0) { pickFromOutput(); outTick = CFG.transferEvery; }
  if (counterZone.inside && ctrTick <= 0) {
    const c = queue[0];
    if (c && c.state === 'queue' && c.atSlot && c.want - c.got - c.pending > 0 && P.stack.count('bouquet') > 0) { transferToCounter(c); ctrTick = 0.12; }
  }
  if (moneyZone.inside && monTick <= 0 && (moneyPile.length > 0 || moneyPile.extra > 0)) { collectMoney(); monTick = 0.035; }
}

function update(dt) {
  T += dt;
  movePlayer(dt);
  updateBeds(dt);
  updateZoneActions(dt);
  updateUpgrades(dt);
  updatePacking(dt, T);
  updateHelper(dt, T);
  // customers spawning
  spawnT -= dt;
  if (spawnT <= 0 && queue.length < CFG.queueMax) { spawnCustomer(26); spawnT = CFG.spawnEvery; }
  updateCustomers(dt, T);
  P.stack.update(dt, T); inputPile.update(dt, T); outputPile.update(dt, T); moneyPile.update(dt, T);
  updateFlights(dt); updateLater(dt); updateParticles(dt); updatePopTexts(dt);
  // camera
  const gp = P.group.position;
  const fw = _v.set(-Math.sin(CFG.yaw), 0, -Math.cos(CFG.yaw));
  const tx = gp.x + P.vel.x * 0.25 + fw.x * 1.8, tz = gp.z + P.vel.z * 0.25 + fw.z * 1.8;
  if (!camInit) { camFocus.set(tx, 0, tz); camInit = true; }
  camFocus.x = damp(camFocus.x, tx, 4.5, dt); camFocus.z = damp(camFocus.z, tz, 4.5, dt);
  const cd = camDist * camMul, H = cd * Math.cos(CFG.tilt), Y = cd * Math.sin(CFG.tilt);
  camera.position.set(camFocus.x + Math.sin(CFG.yaw) * H, Y, camFocus.z + Math.cos(CFG.yaw) * H);
  camera.lookAt(camFocus.x, 0, camFocus.z);
  sun.position.set(gp.x - 9, 24, gp.z + 7); sun.target.position.set(gp.x, 0, gp.z); sun.target.updateMatrixWorld();
  updateTutorial(dt, T); updateHUD(dt);
  saveTimer += dt; if (saveDirty && saveTimer > 2) { saveTimer = 0; writeSave(); }
}

/* =====================================================================
   15. INIT
   ===================================================================== */
buildGround(); buildFences();
// hedges around beds (east side open to the plaza)
buildHedge(-17.85, 0, 0.8, 22.4, 0.95);
buildHedge(-14, -10.7, 7.4, 0.8, 0.95);
buildHedge(-14, 10.7, 7.4, 0.8, 0.95);
buildHedge(-14, -3.7, 6.8, 0.7, 0.8);
buildHedge(-14, 3.7, 6.8, 0.7, 0.8);
// plaza edge hedges / bushes
buildHedge(13.6, 12.9, 4.2, 0.9, 0.9); buildHedge(5.2, 12.9, 6.4, 0.9, 0.9);
for (const [x, z, s] of [[-18, -9, 1], [-6, -9.5, 1.2], [4, -9, 1], [13, -8.5, 1.2], [18, 3, 1], [-19.2, 13, 1], [18.5, 13, 1.1], [6, 13.4, 0.9]]) buildBush(x, z, s);
for (const [x, z, s] of [[-24, -14, 1.5], [-22, 3, 1.3], [-24, 14, 1.6], [-12, -16, 1.4], [0, -16, 1.6], [12, -16, 1.4], [23, -13, 1.5], [24, 2, 1.3], [24, 16, 1.5], [-15, 19, 1.4], [-4, 20, 1.2], [18, 20, 1.5], [-26, -3, 1.6]]) buildTree(x, z, s);
buildDecorFlowers();
for (let i = 0; i < 3; i++) buildBed(i);
buildStations(); buildZones(); buildPlayer();
// restore progress
if (S.lv.bed > 0) { unlockBed(beds[2], true); upPads.bed.done = true; upPads.bed.group.visible = false; }
if (S.lv.helper > 0) { spawnHelper(true); upPads.helper.done = true; upPads.helper.group.visible = false; }
for (const k in upPads) { const u = upPads[k]; if (S.lv[k] >= u.max()) { u.done = true; u.group.visible = false; } else u.redraw(); }
spawnCustomer(15); spawnCustomer(21);
onResize();

window.__game = {
  S, stats, P: () => P, queue, beds, machine, inputPile, outputPile, moneyPile, upPads, zones, customers, CFG, POS,
  helper: () => helper,
  tp(x, z) { P.group.position.set(x, 0, z); P.vel.set(0, 0, 0); camInit = false; },
  sim(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) update(1 / 30); },
  render() { renderer.render(scene, camera); },
  tutStep: () => S.tut, zoom(v) { camMul = v; }
};

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
