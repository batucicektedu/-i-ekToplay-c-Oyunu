<!DOCTYPE html>
<html lang="tr">
<head>

<title>Çiçek Bahçesi</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ff;touch-action:none;overscroll-behavior:none;
    font-family:'Arial Rounded MT Bold','Nunito','Baloo 2','Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0;touch-action:none}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .txt{color:#fff;font-weight:900;letter-spacing:.5px;paint-order:stroke fill;-webkit-text-stroke:5px #16324a;
    text-shadow:0 3px 0 #16324a}
  #hud{position:absolute;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;border-radius:999px;
    background:linear-gradient(rgba(60,110,160,.78),rgba(18,48,84,.85));box-shadow:0 4px 0 rgba(0,0,0,.25), 0 8px 14px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.45), inset 0 0 0 2px rgba(255,255,255,.2)}
  .pill svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  #money{font-size:30px}
  #money.bump{animation:bump .25s ease-out}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #capP{font-size:20px;margin-top:8px;display:flex;width:fit-content}
  #capP svg{width:26px;height:26px}
  #capP.full #capV{color:#ffb703}
  #bRow{display:flex;align-items:center;gap:6px;margin-top:8px;pointer-events:none}
  #beauty{font-size:17px;width:fit-content;padding:3px 12px 3px 6px;gap:6px;pointer-events:auto}
  #beauty svg{width:26px;height:26px}
  #beauty .bb{width:46px;height:10px;border-radius:6px;background:rgba(10,20,40,.75);overflow:hidden;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
  #beauty .bb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(#ffb3dc,#ff4f93)}
  #wardBtn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:50%;background:linear-gradient(rgba(60,110,160,.85),rgba(18,48,84,.9));box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);padding:0;pointer-events:auto}
  #wardBtn svg{width:24px;height:24px}
  #topleft{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(18,48,84,.9);color:#fff;font-weight:900;font-size:14px;padding:10px 16px;border-radius:14px;display:none;z-index:15;pointer-events:none}
  #hint{position:absolute;left:50%;top:max(124px,calc(env(safe-area-inset-top) + 112px));transform:translateX(-50%);display:none;align-items:center;gap:10px;
    padding:8px 18px 8px 12px;border-radius:18px;background:rgba(255,255,255,.92);color:#16324a;font-weight:900;font-size:17px;
    box-shadow:0 4px 0 rgba(0,0,0,.2);white-space:nowrap;animation:hintPulse 1.6s ease-in-out infinite}
  #hint svg{width:34px;height:34px;flex:none;transition:transform .1s linear}
  @keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
  #reset{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:rgba(18,48,74,.55);padding:0;opacity:.8}
  #fsBtn{position:absolute;right:calc(max(12px,env(safe-area-inset-right)) + 52px);top:max(12px,env(safe-area-inset-top));pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:rgba(18,48,74,.55);padding:0;opacity:.8;display:none}
  #fsBtn svg{width:24px;height:24px;display:block;margin:auto}
  #reset svg{width:24px;height:24px;display:block;margin:auto}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,20,40,.55);z-index:20;pointer-events:auto}
  .mbox{background:linear-gradient(#fff,#e9f1ff);border-radius:22px;padding:18px 20px;width:min(300px,86vw);box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
  .mt{font-weight:900;font-size:22px;color:#16324a;text-align:center}
  .mbox button{font:900 17px/1 inherit;font-family:inherit;border:0;border-radius:14px;padding:14px;color:#fff;background:linear-gradient(#4aa8ff,#2f7bff);box-shadow:0 4px 0 #1d4fb0}
  #mReset{background:linear-gradient(#ff6b6b,#e0243c);box-shadow:0 4px 0 #9c1426}
  #mClose{background:linear-gradient(#aab6c8,#8393ab);box-shadow:0 4px 0 #5b6b82}
  #joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);
    border:3px solid rgba(255,255,255,.55);display:none;pointer-events:none;z-index:5}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.2)}
  #goal{position:absolute;left:max(150px,calc(env(safe-area-inset-left) + 138px));right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 54px);height:44px;display:none;align-items:center;gap:8px;padding:3px 12px 3px 4px;border-radius:999px;
    background:linear-gradient(rgba(60,110,160,.82),rgba(18,48,84,.88));box-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4),inset 0 0 0 2px rgba(255,255,255,.18)}
  #goal canvas{width:38px;height:38px;flex:none;border-radius:50%;background:rgba(255,255,255,.2)}
  #goal .gm{flex:1;min-width:0}
  #goal .gn{font-size:13px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:3px #16324a}
  #goal .gb{position:relative;height:16px;margin-top:2px;border-radius:8px;background:rgba(10,20,40,.7);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
  #goal .gb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(#9dff6a,#2fc43a);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
  #goal .gb b{position:absolute;inset:0;text-align:center;font-size:12px;line-height:16px;-webkit-text-stroke:3px #16324a}
  #goal.pulse{animation:gpulse .5s ease-out}
  @keyframes gpulse{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
  #intro{position:absolute;left:0;right:0;top:56%;height:180px;display:none;pointer-events:none;z-index:6;text-align:center}
  #intro .hand{position:absolute;left:50%;top:0;width:84px;height:100px;margin-left:-42px;animation:swipe 1.7s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
  #intro .ring{position:absolute;left:50%;top:6px;width:60px;height:60px;margin-left:-30px;border-radius:50%;border:5px solid rgba(255,255,255,.85);animation:swipeRing 1.7s ease-in-out infinite}
  #intro .path{position:absolute;left:50%;top:30px;width:150px;height:0;margin-left:-75px;border-top:6px dotted rgba(255,255,255,.75);border-radius:6px}
  #intro .it{position:absolute;left:0;right:0;top:118px;font-size:30px;animation:hintPulse2 1.2s ease-in-out infinite}
  @keyframes swipe{0%{transform:translate(-75px,10px) scale(1)}12%{transform:translate(-75px,14px) scale(.86)}78%{transform:translate(75px,14px) scale(.86)}92%,100%{transform:translate(75px,10px) scale(1);opacity:0}}
  @keyframes swipeRing{0%{transform:translate(-75px,10px) scale(.6);opacity:0}12%{transform:translate(-75px,14px) scale(1);opacity:1}78%{transform:translate(75px,14px) scale(1);opacity:1}92%,100%{transform:translate(75px,10px) scale(1.3);opacity:0}}
  @keyframes hintPulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #praise{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:46px;pointer-events:none;opacity:0;z-index:7}
  #praise.big{font-size:40px}
  #praise.show{animation:praisePop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes praisePop{0%{transform:scale(.3) rotate(-6deg);opacity:0}18%{transform:scale(1.25) rotate(3deg);opacity:1}30%{transform:scale(1) rotate(0)}78%{transform:scale(1);opacity:1}100%{transform:scale(1) translateY(-40px);opacity:0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  #flash.on{animation:flashA .35s ease-out}
  @keyframes flashA{0%{opacity:.55}100%{opacity:0}}
  #fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
  .coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc21a 55%,#c98400);border:2px solid #8a5a00;box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .gain{position:absolute;font-size:24px;color:#6dff6a;font-weight:900;-webkit-text-stroke:4px #0c2a12;paint-order:stroke fill;animation:gainUp .9s ease-out forwards}
  @keyframes gainUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{transform:translateY(-6px) scale(1.15);opacity:1}100%{transform:translateY(-44px) scale(1);opacity:0}}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#16324a;font-size:20px;text-align:center;padding:20px;background:#8fd8ff;z-index:10}
</style>

<body>
<div id="app">

  </div>
  <div id="menu"><div class="mbox"><div class="mt">Ayarlar</div><button id="mQ"></button><button id="mFs" style="display:none">Tam Ekran</button><button id="mReset">İlerlemeyi sıfırla</button><button id="mClose">Kapat</button></div></div>
  <div id="fx"></div><div id="flash"></div><div id="praise" class="txt"></div>

    <svg class="hand" viewBox="0 0 84 100"><path d="M30 8c0-5 4-8 8-8s8 3 8 8v36l4-2c4-2 9 0 10 4l1 3 4-1c4-1 8 1 9 5l1 4 3-1c4-1 8 2 8 6v18c0 14-10 26-24 26H46c-9 0-15-5-20-12L8 62c-3-4-1-9 3-11 3-1 7 0 9 3l10 14z" fill="#ffe0bd" stroke="#16324a" stroke-width="4" stroke-linejoin="round" transform="scale(.9) translate(2,4)"/></svg>

<div id="msg">Three.js yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
'use strict';
if (typeof THREE === 'undefined') { document.getElementById('msg').style.display = 'flex'; return; }

/* =====================================================================
   1. CONFIG
   ===================================================================== */
const CFG = {
  yaw: 0.45, tilt: 52 * Math.PI / 180, fov: 45,
  baseSpeed: 5.6, speedStep: 0.15,
  capBase: 25, capStep: 10,
  growTime: 4, billValue: 15,

  transferEvery: 0.04,
  inputCap: 24, outputCap: 16, moneyCap: 60,
  queueMax: 6, spawnEvery: 1.4, spawnShortEvery: 0.6, walkSpeed: 5.0, leaveSpeed: 5.7, queueX: 10, queueZ0: -1.5, queueGap: 1.5,
  helperCap: 6,
  bounds: { x0: -19, x1: 17.8, z0: -10.4, z1: 16 },

};
const geo = (base, n) => Array.from({ length: n }, (_, i) => Math.max(5, Math.round(base * Math.pow(1.3, i) / 5) * 5));
const PRICE = { bouquet: 15, pot: 45, sachet: 70, perfume: 250, sbq: 120, tea: 45 };
const PROD_LIST = ['bouquet', 'pot', 'sachet', 'perfume', 'sbq'], LANES = {}, SRCS = {}, OUTSPOT = {}, ICONF = {}, PZ = {}, STN = {};
let priceMul = () => 1;
const UPG = {
  sera: { name: 'Sera', costs: [1800] }, van: { name: 'Minibüs', costs: [2500] }, cashier: { name: 'Kasiyer', costs: [90] }, carrier: { name: 'Taşıyıcı', costs: [320] },
  cashSpd: { name: 'Kasiyer Hızı', costs: geo(100, 5) }, carSpd: { name: 'Taşıyıcı Hızı', costs: geo(140, 5) },

};
const GOALS = [
  { key: 'speed', lv: 1 }, { key: 'pack', lv: 1 }, { key: 'cap', lv: 1 }, { key: 'cashier', lv: 1 }, { key: 'bed', lv: 1 }, { key: 'helper', lv: 1 },
  { key: 'speed', lv: 2 }, { key: 'carrier', lv: 1 }, { key: 'pack', lv: 2 }, { key: 'cap', lv: 2 }, { key: 'cashSpd', lv: 1 }, { key: 'helpSpd', lv: 1 },
  { key: 'sera', lv: 1 },
  { key: 'carSpd', lv: 1 }, { key: 'carCap', lv: 1 }, { key: 'pack', lv: 3 }, { key: 'speed', lv: 3 }, { key: 'van', lv: 1 },
  { key: 'cap', lv: 3 }, { key: 'cashSpd', lv: 2 }, { key: 'helpSpd', lv: 2 }, { key: 'carSpd', lv: 2 }, { key: 'carCap', lv: 2 }, { key: 'pack', lv: 4 }, { key: 'speed', lv: 4 }, { key: 'cap', lv: 4 },
  { key: 'cashSpd', lv: 3 }, { key: 'helpSpd', lv: 3 }, { key: 'carSpd', lv: 3 }, { key: 'carCap', lv: 3 }, { key: 'pack', lv: 5 }, { key: 'speed', lv: 5 }, { key: 'cap', lv: 5 },
  { key: 'cashSpd', lv: 4 }, { key: 'helpSpd', lv: 4 }, { key: 'carSpd', lv: 4 }, { key: 'carCap', lv: 4 }, { key: 'cashSpd', lv: 5 }, { key: 'helpSpd', lv: 5 }, { key: 'carSpd', lv: 5 }, { key: 'carCap', lv: 5 }
];
const GFIRST = {}; GOALS.forEach((g, i) => { if (GFIRST[g.key] === undefined) GFIRST[g.key] = i; });
const POS = {
  packTable: { x: -2.2, z: -2.2 }, packPad: { x: -6.2, z: 0.7 },
  outTable: { x: 1.4, z: -2.2 }, outPad: { x: 1.4, z: 0.7 },
  counter: { x: 10, z: -3.4 }, counterPad: { x: 7.4, z: -1.3 },

  beds: [{ x: -14, z: -8 }, { x: -14, z: 0 }, { x: -14, z: 8 }],
  potOut: { x: 42.6, z: -0.4 }, upgradeZ: 9.4, upgradeZ2: 6.0
};
const TABLE_Y = 1.0;
const FLOWER_COLS = [0xe0001c, 0xff1f8e, 0xffd400, 0x8f2be8, 0xfff0cc];
const SAVE_KEY = 'cicek_bahcesi_v1';

/* =====================================================================
   2. UTILS, SAVE, AUDIO
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const rand = (a, b) => a + Math.random() * (b - a);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

  const fsBtn = document.getElementById('fsBtn'), mFs = document.getElementById('mFs');
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const ICON_IN = '<svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_OUT = '<svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  const refresh = () => { try { const f = isFs(); fsBtn.innerHTML = f ? ICON_OUT : ICON_IN; fsBtn.setAttribute('aria-label', f ? 'Tam ekrandan çık' : 'Tam ekran'); mFs.textContent = f ? 'Tam Ekrandan Çık' : 'Tam Ekran'; } catch (e) {} };
  const toggleFs = () => {
    try {
      if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      const req = de.requestFullscreen || de.webkitRequestFullscreen;

      const lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait'); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
      if (r && r.then) r.then(lock, () => {}); else lock();

  };
  if (supported && !standalone()) {
    fsBtn.style.display = 'block'; mFs.style.display = 'block'; refresh();
    fsBtn.addEventListener('click', toggleFs);
    mFs.addEventListener('click', () => { toggleFs(); menuEl.style.display = 'none'; });
    document.addEventListener('fullscreenchange', refresh);
    document.addEventListener('webkitfullscreenchange', refresh);
  }

    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}
